name: public-record-checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check JavaScript syntax
        run: git ls-files -z '*.mjs' | xargs -0 -r -n1 node --check
      - name: Run offline tests
        run: node --test test/*.test.mjs
      - name: Validate public claims and ledger state
        run: node scripts/validate-public.mjs
